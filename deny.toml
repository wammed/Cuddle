# Configuration for cargo-deny (Cuddle - Safe Linux File Workbench)
# Enforces permissive license compliance for all direct and transitive Rust dependencies.

[graph]
# Cuddle officially only supports Linux (x86_64 and aarch64).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
unmaintained = "none"
ignore = [
    { id = "RUSTSEC-2026-0403", reason = "Transitive dependency via tantivy 0.26.2 -> zstd 0.13.3 -> zstd-safe 7.3.0. Upstream fix in zstd-safe >= 8.2.0 requires tantivy release update." },
    { id = "RUSTSEC-2026-0391", reason = "Transitive dependency via tantivy 0.26.2 -> zstd 0.13.3. Upstream fix in zstd >= 0.14.3 requires tantivy release update." },
    { id = "RUSTSEC-2026-0398", reason = "Transitive dependency via tantivy 0.26.2 -> zstd 0.13.3 -> zstd-safe 7.3.0. Upstream fix in zstd-safe >= 8.2.0 requires tantivy release update." },
]

[licenses]
# The threshold of confidence in license matching (0.0 to 1.0)
confidence-threshold = 0.8

# List of explicitly allowed permissive licenses
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

# Explicit, individually audited exceptions for file-level weak copyleft (MPL-2.0) dependencies.
# Strong copyleft (GPL, AGPL, LGPL) is strictly prohibited.
# MPL-2.0 crates listed here are isolated utility crates where no source code modifications exist,
# and Cuddle is distributed under a source-only distribution model.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser@0.37.0" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros@0.7.1" },
    { allow = ["MPL-2.0"], crate = "dtoa-short@0.3.5" },
    { allow = ["MPL-2.0"], crate = "htmlescape@0.3.1" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "selectors@0.38.0" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
