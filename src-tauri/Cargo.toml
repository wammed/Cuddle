[package]
name = "fileworkbench"
version = "0.1.0"
license = "MIT"
publish = false
description = "A safe Linux file workbench that hugs your originals tight."
authors = ["susie"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fileworkbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
landlock = "0.4.7"
ts-rs = "12"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "5"
walkdir = "2"
tantivy = "0.26"
lindera = { version = "5", features = ["embed-ipadic"] }
lindera-tantivy = { version = "5", features = ["embed-ipadic"] }
encoding_rs = "0.8"
chardetng = "1.0"
libc = "0.2"
sha2 = "0.10"
similar = "2.6"
regex = "1.10"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
tar = "0.4"
flate2 = "1.0"
filetime = "0.2"
kamadak-exif = "0.6"
pulldown-cmark = { version = "0.12", default-features = false }
quick-xml = "0.41"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
