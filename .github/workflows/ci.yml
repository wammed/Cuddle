name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri 2 Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-work-dir: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust formatting check (cargo fmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust static analysis (cargo clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests (Cargo)
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run Frontend tests (Vitest)
        run: pnpm test -- --run

      - name: Verify TypeScript & Vite production build
        run: pnpm run build

      - name: Verify Tauri Linux application build
        run: pnpm tauri build --no-bundle
