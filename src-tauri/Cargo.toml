[package]
name = "fileworkbench"
version = "0.1.0"
description = "A safe Linux file workbench that hugs your originals tight."
authors = ["susie"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fileworkbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
landlock = "0.4.7"
ts-rs = "12"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "5"
walkdir = "2"
tantivy = "0.26"
lindera = { version = "5", features = ["embed-ipadic"] }
lindera-tantivy = { version = "5", features = ["embed-ipadic"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
